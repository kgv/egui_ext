[package]
name = "egui_ext"
version = "0.7.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false }
egui = { version = "0.35.0", default-features = false }
egui-phosphor = "0.12.0"
egui_extras = "0.35.0"
thiserror = "2.0.18"

egui_commonmark = { version = "0.24.0", features = [
    "pulldown_cmark",
], optional = true }
ratex-layout = { version = "0.1.12", optional = true }
ratex-parser = { version = "0.1.12", optional = true }
ratex-svg = { version = "0.1.12", features = ["embed-fonts"], optional = true }
ratex-types = { version = "0.1.12", optional = true }
tracing = { version = "0.1.44", optional = true }

# Web
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = [
    "FilePropertyBag",
    "HtmlAnchorElement",
    "Url",
] }

[features]
default = ["markdown"]
markdown = [
    "dep:egui_commonmark",
    "dep:ratex-layout",
    "dep:ratex-parser",
    "dep:ratex-svg",
    "dep:ratex-types",
    "egui_extras/svg",
]
